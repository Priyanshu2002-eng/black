<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Black — see the time you have</title>
<meta name="description" content="Black shows your life, year, month, week and day as dots that go dark as time passes. Track habits, count down to dates, and focus. Private, offline, free.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Black — see the time you have">
<meta property="og:description" content="Your time as dots that go dark. Habits, countdowns and a focus timer. Private and offline.">
<meta property="og:type" content="website">
<meta property="og:image" content="icons/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <h1 id="view-title">Time</h1>
  <button id="settings-btn" class="icon-btn" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
  </button>
</header>

<main id="main" tabindex="-1"></main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="time" aria-current="page"><span class="glyph g-time"></span>Time</button>
  <button data-tab="habits"><span class="glyph g-habits"></span>Habits</button>
  <button data-tab="ahead"><span class="glyph g-ahead"></span>Ahead</button>
  <button data-tab="focus"><span class="glyph g-focus"></span>Focus</button>
</nav>

<dialog id="sheet"></dialog>
<noscript><p style="padding:24px">Black needs JavaScript to run.</p></noscript>
<script src="app.js"></script>
</body>
</html>
